<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="370" viewBox="0 0 1500 370" role="img" aria-labelledby="title desc"><title id="title">Assert Skill workflow</title><desc id="desc">Establish both languages, interview the user, propose the structure, prepare foundations and setup, and finish with WP0 ready. Reuse known answers. Execute only within scope.</desc><rect width="1500" height="370" rx="24" fill="#071827"/><text x="48" y="55" font-family="sans-serif" font-size="25" font-weight="700" fill="#f7f2df">Assert Skill: from idea to a verifiable project</text>
<path d="M298 168h24m-7-7 7 7-7 7" fill="none" stroke="#f0bd6b" stroke-width="3"/>
<rect x="40" y="95" width="258" height="148" rx="17" fill="#102d40" stroke="#3db7b8" stroke-width="2"/><text x="60" y="131" font-family="sans-serif" font-size="21" fill="#f0bd6b">01</text><text x="60" y="171" font-family="sans-serif" font-size="21" font-weight="700" fill="#fff9eb">Two languages</text><text x="60" y="206" font-family="sans-serif" font-size="16" fill="#b7d0d6">Conversation + artifacts</text>
<path d="M590 168h24m-7-7 7 7-7 7" fill="none" stroke="#f0bd6b" stroke-width="3"/>
<rect x="332" y="95" width="258" height="148" rx="17" fill="#102d40" stroke="#3db7b8" stroke-width="2"/><text x="352" y="131" font-family="sans-serif" font-size="21" fill="#f0bd6b">02</text><text x="352" y="171" font-family="sans-serif" font-size="21" font-weight="700" fill="#fff9eb">Project interview</text><text x="352" y="206" font-family="sans-serif" font-size="16" fill="#b7d0d6">Seven relevant categories</text>
<path d="M882 168h24m-7-7 7 7-7 7" fill="none" stroke="#f0bd6b" stroke-width="3"/>
<rect x="624" y="95" width="258" height="148" rx="17" fill="#102d40" stroke="#3db7b8" stroke-width="2"/><text x="644" y="131" font-family="sans-serif" font-size="21" fill="#f0bd6b">03</text><text x="644" y="171" font-family="sans-serif" font-size="21" font-weight="700" fill="#fff9eb">Proposal</text><text x="644" y="206" font-family="sans-serif" font-size="16" fill="#b7d0d6">Scope, roles, review, files</text>
<path d="M1174 168h24m-7-7 7 7-7 7" fill="none" stroke="#f0bd6b" stroke-width="3"/>
<rect x="916" y="95" width="258" height="148" rx="17" fill="#102d40" stroke="#3db7b8" stroke-width="2"/><text x="936" y="131" font-family="sans-serif" font-size="21" fill="#f0bd6b">04</text><text x="936" y="171" font-family="sans-serif" font-size="21" font-weight="700" fill="#fff9eb">Foundations + setup</text><text x="936" y="206" font-family="sans-serif" font-size="16" fill="#b7d0d6">Plan, decisions, agents</text>
<rect x="1208" y="95" width="258" height="148" rx="17" fill="#102d40" stroke="#3db7b8" stroke-width="2"/><text x="1228" y="131" font-family="sans-serif" font-size="21" fill="#f0bd6b">05</text><text x="1228" y="171" font-family="sans-serif" font-size="21" font-weight="700" fill="#fff9eb">Ready WP0</text><text x="1228" y="206" font-family="sans-serif" font-size="16" fill="#b7d0d6">Acceptance + checkpoint</text>
<text x="48" y="290" font-family="sans-serif" font-size="19" fill="#b7d0d6">Reuse known answers. Scale the process. Preserve evidence.</text><text x="48" y="325" font-family="sans-serif" font-size="18" fill="#b7d0d6">Setup-only ends at WP0; implementation continues only within the authorized mandate.</text></svg>
